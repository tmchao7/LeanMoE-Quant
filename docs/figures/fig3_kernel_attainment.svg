<text x="770.0" y="496.0" font-size="10.5" fill="#1f2328" font-weight="400" text-anchor="start">w4a16  3.88× / 2.24×</text>
<text x="230.0" y="514.0" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">Byte savings do not convert 1:1 — the in-kernel unpacking is the added cost, so attainment falls as bit-width drops.</text>
<text x="24.0" y="530.0" font-size="9.0" fill="#57606a" font-weight="400" text-anchor="start">Data: results/ncu_evidence/isolated.json — cold timing (256 MB L2 flush before each timed call) minus the measured event floor</text>
<text x="24.0" y="543.0" font-size="9.0" fill="#57606a" font-weight="400" text-anchor="start">Full provenance per number: docs/figures/inputs.json</text>
