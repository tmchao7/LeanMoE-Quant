# configs/models.yaml — 模型清单（唯一来源）
#
# 角色说明与选型理由见 docs/MODELS.md。
# 约束：主开发机是 V100 32GB (sm_70)，**一律 fp16**，不可用 bf16。
# 本文件不硬编码本机路径；下载后把路径写进 ENVIRONMENT.md 的「本机附录」。

machine:
  primary:
    name: "V100 32GB"
    arch: "sm_70"
    vram_gb: 32
    gpu_count_physical: 15
    gpu_count_used: 1           # 本项目恒为单卡
    dtype: "float16"            # 硬约束：无 bf16
    notes: "school-provided; shared machine — release memory when done"
  rental_targets:               # 可租对照机（用户已确认可租）
    - name: "RTX 5090"
      vram_gb: 32
      bandwidth_gbps_spec: 1792
      priority: 1
    - name: "RTX 4090"
      vram_gb: 24
      bandwidth_gbps_spec: 1008
      priority: 2
    - name: "L40S"
      vram_gb: 48
      bandwidth_gbps_spec: 864
      priority: 3
      purpose: "只用于 Qwen3-30B-A3B INT4 单点"

models:
  - role: dev
    repo: "Qwen/Qwen2.5-0.5B"
    arch: "qwen2"
    total_params_b: 0.49
    dtype: "float16"
    size_gb_fp16: 1.0
    purpose: "kernel 迭代、单测、--dry-run"
    local_path: null            # 下载后填写，不要提交真实路径
    verified_on_v100: false

  - role: dev
    repo: "Qwen/Qwen2.5-1.5B"
    arch: "qwen2"
    total_params_b: 1.54
    dtype: "float16"
    size_gb_fp16: 3.0
    purpose: "dense 曲线主体"
    local_path: null
    verified_on_v100: false

  - role: primary_moe
    # ⚠️ `-0924` 后缀必需：`allenai/OLMoE-1B-7B` 不存在（hf-mirror 对不存在仓库返回 401）。
    repo: "allenai/OLMoE-1B-7B-0924"
    arch: "olmoe"
    layers: 16
    hidden: 2048
    num_experts: 64
    top_k: 8
    expert_ffn_dim: 1024
    total_params_b: 6.92
    activated_params_b: 1.18
    dtype: "float16"
    checkpoint_dtype: "bfloat16"   # config.json 自述；上机必须转 fp16（无 bf16 张量核的卡）
    size_gb_fp16: 13.84
    # 3 个 shard 的实测总字节数（2026-09 由 hf-mirror HEAD 取得）——下载后必须校验
    total_bytes: 13838721960
    num_shards: 3
    local_path: null
    verified_config: true          # 架构数字已由 config.json 逐项核实，见 docs/MODELS.md §3.1
    verified_on_target: false      # 是否已在目标机上加载并前向
    purpose: "MoE 主线实验（路由开销、专家层量化敏感度、收益上限）"
    note: "config.json 已核实；每-token 权重字节 [W] = 2,357,723,136 B，专家占 68.3%（docs/MODELS.md §3.2）"

  - role: dense_comparison
    repo: "Qwen/Qwen3-4B"
    arch: "qwen3"
    total_params_b: 4.0
    dtype: "float16"
    size_gb_fp16: 8.0
    purpose: "同规模 dense vs MoE 对比"
    local_path: null
    verified_on_v100: false

  - role: dense_comparison
    repo: "Qwen/Qwen3-8B"
    arch: "qwen3"
    total_params_b: 8.2
    dtype: "float16"
    size_gb_fp16: 16.4
    purpose: "上界对照（32GB 下紧但可行）"
    local_path: null
    verified_on_v100: false

  - role: stretch
    repo: "Qwen/Qwen3-30B-A3B"
    arch: "qwen3_moe"
    layers: 48
    hidden: 2048
    num_experts: 128
    top_k: 8
    expert_ffn_dim: 768
    total_params_b: 30.52
    activated_params_b: 3.34
    dtype: "int4"                # 计划位宽
    size_gb_fp16: 61.0
    size_gb_int4: 15.3
    purpose: "scale 单点验证"
    fits_primary_machine: false  # 32GB V100 装不下
    requires_rental: "L40S / A6000 (48GB)"
    local_path: null
    verified_on_v100: false

# 量化基线（外部实现，仅作对照；方法贡献归本项目）
baselines:
  - name: bitsandbytes
    role: "L1 公平对手（INT8 / NF4）"
    in_scope: true
  - name: torchao
    role: "L1 公平对手（int8/int4 权重）"
    in_scope: true
  - name: vllm
    role: "L2 工程天花板"
    in_scope: true
  - name: gptq_checkpoint
    role: "预量化 checkpoint，仅作对照，不作为主贡献"
    in_scope: "as_baseline_only"
